name: release

# 打 tag（如 v1.0.0）触发：交叉编译多平台二进制 → 组装 npm 子包/主包 → 发布
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "手动发布的版本号（不含 v 前缀），用于无 tag 测试"
        required: false

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-apple-darwin
            runner: macos-latest
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            cross: true
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (linux-arm64)
        if: matrix.cross
        run: cargo install cross --locked

      - name: Build (native)
        if: ${{ !matrix.cross }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Stage binary
        shell: bash
        run: |
          mkdir -p "artifacts/${{ matrix.target }}"
          if [ "${{ matrix.runner }}" = "windows-latest" ]; then
            cp "target/${{ matrix.target }}/release/swagger.exe" "artifacts/${{ matrix.target }}/swagger.exe"
          else
            cp "target/${{ matrix.target }}/release/swagger" "artifacts/${{ matrix.target }}/swagger"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: artifacts/${{ matrix.target }}/*

  publish:
    name: publish to npm
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: artifacts
          merge-multiple: false

      # download-artifact 会把每个 artifact 放进 artifacts/bin-<target>/，
      # 整理成 build-npm.mjs 期望的 artifacts/<target>/swagger[.exe]
      - name: Normalize artifact layout
        run: |
          set -e
          for d in artifacts/bin-*; do
            target="${d#artifacts/bin-}"
            mkdir -p "artifacts/$target"
            cp "$d"/* "artifacts/$target/"
          done
          ls -R artifacts

      - name: Resolve version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build & publish npm packages
        run: node scripts/build-npm.mjs "${{ steps.ver.outputs.version }}" --publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
