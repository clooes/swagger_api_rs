[package]
name = "swagger_api"
version = "1.0.0"
edition = "2024"

# 二进制名保持 swagger，与 npm 启动器约定一致（见 MIGRATION.md §14.3）
[[bin]]
name = "swagger"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 保持 paths / schemas / properties 的插入顺序，保证输出稳定（原 JS 依赖 for..in 顺序）
indexmap = { version = "2", features = ["serde"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[dev-dependencies]
insta = "1"

[profile.release]
strip = true       # 减小二进制体积，利于 npm 分发
lto = true
